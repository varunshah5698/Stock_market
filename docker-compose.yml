services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockpulse
      POSTGRES_USER: stockpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpulse-local-only}
    volumes:
      - stockpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpulse -d stockpulse"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      DATABASE_URL: postgresql+psycopg://stockpulse:${POSTGRES_PASSWORD:-stockpulse-local-only}@db:5432/stockpulse
      AUTO_CREATE_SCHEMA: "false"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:8000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      DATABASE_URL: postgresql+psycopg://stockpulse:${POSTGRES_PASSWORD:-stockpulse-local-only}@db:5432/stockpulse
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTO_CREATE_SCHEMA: "false"
      BACKGROUND_JOBS: "true"
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-yahoo}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  stockpulse_pgdata:
